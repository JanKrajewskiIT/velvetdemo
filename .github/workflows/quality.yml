name: Code quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/quality-package.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      working-directory: .
      node-version-file: .nvmrc
      verify-env: '{}'
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
