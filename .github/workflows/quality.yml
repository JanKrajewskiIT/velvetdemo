name: Code quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/quality-package.yml@02dab9241be047d4c8da72a9dac3c2d2f3ac8451 # v3.26.0
    with:
      working-directory: .
      node-version-file: .nvmrc
      verify-env: '{}'
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
