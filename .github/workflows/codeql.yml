name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@0cdf78e693ab2d8b1cf5104872cbc4970fc2deb2 # v3.7.12
    permissions:
      actions: read
      contents: read
      security-events: write
