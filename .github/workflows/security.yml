name: Periodic security
on:
  schedule:
    - cron: 23 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: periodic-security
  cancel-in-progress: false
jobs:
  source:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-source.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  dependencies:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-dependencies.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      working-directory: .
      node-version-file: .nvmrc
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
  images:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-images.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
    with:
      images: '["ghcr.io/jankrajewskiit/velvet-demo:latest"]'
  spa-build:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/build-package.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      working-directory: .
      node-version-file: .nvmrc
      build-script: build:release
      spa-artifact: security-spa
      verify-env: '{}'
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  spa-security:
    needs: spa-build
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-spa.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      artifact-name: security-spa
      waf-enabled: false
    permissions:
      contents: read
