name: Staging DAST
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
        required: true
        description: Scan the allowlisted staging host; full/api are active scans.
permissions:
  contents: read
jobs:
  scan:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-dast.yml@6b71917b7609caae9b1b0e14dd90968108aa563f # v3.12.1
    with:
      mode: ${{ inputs.mode }}
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
