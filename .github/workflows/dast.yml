name: Staging DAST
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
        required: true
        description: Scan the allowlisted staging host; full/api are active scans.
permissions:
  contents: read
jobs:
  scan:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-dast.yml@e9100fa7ea7797669afeb410b644cd46ff9c8064 # v3.7.0
    with:
      mode: ${{ inputs.mode }}
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
