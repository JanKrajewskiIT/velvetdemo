name: Staging DAST
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
        required: true
        description: Scan the allowlisted staging host; full/api are active scans.
permissions:
  contents: read
jobs:
  scan:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-dast.yml@0d574e1e43ae072a9ec54852490f1b5eb5dc9c8a # v3.19.0 tooling fix
    with:
      mode: ${{ inputs.mode }}
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
