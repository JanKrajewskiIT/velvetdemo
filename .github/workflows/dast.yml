name: Staging DAST
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
        required: true
        description: Scan the allowlisted staging host; full/api are active scans.
permissions:
  contents: read
jobs:
  scan:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/security-dast.yml@b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
    with:
      mode: ${{ inputs.mode }}
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
