name: CI
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-package.yml@b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
    with:
      spa-artifact: velvet-spa
      dockerfile-check: true
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  image:
    needs: verify
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-spa.yml@b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
    permissions:
      contents: read
permissions:
  contents: read
