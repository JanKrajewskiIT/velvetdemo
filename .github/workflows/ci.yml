name: Build
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/build-package.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    with:
      spa-artifact: velvet-spa
      build-script: build:release
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  image:
    needs: verify
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/build-spa.yml@ad587f572dab1149288acf3f8001a7ea6ea9e225 # v3.21.0
    permissions:
      contents: read
permissions:
  contents: read
