name: CI
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-package.yml@9d7851722b143c4d8aaf7ca0f2058f5ae149fe44 # v3.5.3
    with:
      spa-artifact: velvet-spa
      dockerfile-check: true
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  image:
    needs: verify
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-spa.yml@9d7851722b143c4d8aaf7ca0f2058f5ae149fe44 # v3.5.3
    permissions:
      contents: read
permissions:
  contents: read
