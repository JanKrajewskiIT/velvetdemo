name: CI
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false
      NPM_READ_TOKEN:
        required: false
      CONFIGS_READ_TOKEN:
        required: false
jobs:
  verify:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-package.yml@4fd5cec48d9007aee67644ce29fdedef392f1dea # v3.20.0
    with:
      spa-artifact: velvet-spa
      dockerfile-check: true
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  image:
    needs: verify
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/verify-spa.yml@4fd5cec48d9007aee67644ce29fdedef392f1dea # v3.20.0
    with:
      waf-enabled: false
    permissions:
      contents: read
permissions:
  contents: read
