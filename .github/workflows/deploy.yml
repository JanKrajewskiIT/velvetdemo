name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: null
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: velvet-demo
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      cosign_url: ${{ steps.security.outputs.cosign_url }}
      cosign_sha256: ${{ steps.security.outputs.cosign_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JanKrajewskiIT/velvetconfigs
          ref: b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
          path: tooling
          persist-credentials: false
          token: ${{ secrets.CONFIGS_READ_TOKEN || github.token }}
          sparse-checkout: |
            scripts
            security
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Install checksum-pinned security tools
        run: node tooling/scripts/security-tools.mjs trivy cosign
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set variables
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: velvet-spa-image
          path: .artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: spa-security
          path: .artifacts/security
      - name: Push and sign verified frontend image
        env:
          OWNER_LC: ${{ steps.vars.outputs.owner_lc }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker load --input .artifacts/spa-image.tar.gz
          image="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          docker tag velvet-spa:verified "$image:$IMAGE_TAG"
          docker tag velvet-spa:verified "$image:latest"
          docker push "$image:$IMAGE_TAG"
          docker push "$image:latest"
          digest=$(docker buildx imagetools inspect "$image:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -er ' .digest | select(test("^sha256:[a-f0-9]{64}$"))')
          sbom=.artifacts/security/image/sbom.cdx.json
          reference="${image%:*}@$digest"
          cosign sign --yes --annotations "commit=$IMAGE_TAG" "$reference"
          cosign attest --yes --type cyclonedx --predicate "$sbom" "$reference"
          printf 'VELVET_DEMO_IMAGE=%s@%s\n' "$image" "$digest" > images.txt
      - name: Prepare deployment verification metadata
        id: security
        run: |
          mkdir -p .artifacts/deployment
          cp images.txt tooling/security/verify-release.sh tooling/security/waf.compose.yml .artifacts/deployment/
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tool = JSON.parse(readFileSync('tooling/security/tools.json', 'utf8')).binaries.cosign;
          appendFileSync(process.env.GITHUB_OUTPUT, `cosign_url=${tool.url}\ncosign_sha256=${tool.sha256}\n`);
          NODE
      - name: Upload signed deployment manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-deployment
          path: .artifacts/deployment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      OWNER_LC: ${{ needs.publish.outputs.owner_lc }}
      COSIGN_URL: ${{ needs.publish.outputs.cosign_url }}
      COSIGN_SHA256: ${{ needs.publish.outputs.cosign_sha256 }}
      SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
      WAF_MODE: ${{ vars.WAF_MODE || 'DetectionOnly' }}
      EXPECTED_IMAGES: VELVET_DEMO_IMAGE
    steps:
      - name: Require SSH host identity
        env:
          FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: '[[ "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || { echo "Missing/invalid VPS_HOST_FINGERPRINT"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-deployment
          path: signed-deployment
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml,signed-deployment/images.txt,signed-deployment/verify-release.sh,signed-deployment/waf.compose.yml
          target: /opt/velvet
          strip_components: 0
          timeout: 60s
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          REGISTRY: ghcr.io
          OWNER_LC: ${{ env.OWNER_LC }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_NAME: velvet-demo
          COSIGN_URL: ${{ env.COSIGN_URL }}
          COSIGN_SHA256: ${{ env.COSIGN_SHA256 }}
          SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          WAF_MODE: ${{ env.WAF_MODE }}
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN || secrets.GHCR_TOKEN }}
          EXPECTED_IMAGES: ${{ env.EXPECTED_IMAGES }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,OWNER_LC,IMAGE_TAG,IMAGE_NAME,REGISTRY_READ_TOKEN,COSIGN_URL,COSIGN_SHA256,SIGNING_IDENTITY,WAF_MODE,EXPECTED_IMAGES
          script: |
            set -euo pipefail
            umask 077
            cd /opt/velvet
            case "$WAF_MODE" in On|DetectionOnly) ;; *) echo "Invalid WAF_MODE" >&2; exit 1 ;; esac
            cp -f signed-deployment/images.txt signed-deployment/verify-release.sh signed-deployment/waf.compose.yml .

            cp -f deploy/docker-compose.yml .

            : > .env

            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            echo "${REGISTRY_READ_TOKEN}" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin
            sh verify-release.sh
            cat images.txt >> .env
            printf 'WAF_MODE=%s\n' "$WAF_MODE" >> .env
            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
            docker compose ps
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
      - name: Smoke test
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Waiting for container to become healthy..."
            for i in $(seq 1 12); do
              if docker ps --filter "name=velvet-demo" --format "{{.Status}}" | grep -q "healthy"; then
                echo "Container is healthy."
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "ERROR: Container did not become healthy within 60s"
                docker ps --filter "name=velvet-demo" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                exit 1
              fi
              sleep 5
            done

            echo "Checking HTTPS endpoint and certificate via Traefik..."
            sleep 30
            curl -sf --retry 5 --retry-delay 15 --max-time 15 https://velvet.bluebraces.online/ > /dev/null && echo "Demo: OK (valid cert)" || \
            { echo "ERROR: Demo not reachable via HTTPS"; curl -v https://velvet.bluebraces.online/ 2>&1 | tail -20; exit 1; }

            echo "Smoke test completed."
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
